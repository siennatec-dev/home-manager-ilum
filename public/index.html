<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iluminação</title>
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Iluminação">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><b id="glow"></b></div>

  <main class="app">
    <header class="top">
      <div class="top-text">
        <button id="connBtn" class="eyebrow" title="Atualizar agora"><span id="conn" class="dot"></span><span id="connText">Conectando…</span></button>
        <h1 id="greeting">Iluminação</h1>
        <p id="summary" class="summary">—</p>
      </div>
      <div class="top-actions">
        <button id="allOff" class="icon-btn glass" aria-label="Apagar tudo" title="Apagar tudo"></button>
        <button id="settingsBtn" class="icon-btn glass" aria-label="Ajustes" title="Ajustes"></button>
      </div>
    </header>

    <section class="block">
      <div class="block-head">
        <h2>Cenas</h2>
        <button class="link" id="manageScenes">Editar</button>
      </div>
      <div id="scenes" class="scenes"></div>
    </section>

    <nav id="chips" class="chips" aria-label="Filtrar ambientes"></nav>
    <div id="content"></div>
    <p class="foot">Toque para ligar/desligar · arraste para os lados para ajustar · segure para mais opções</p>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div id="sheetCard" class="sheet-card glass-strong" role="dialog" aria-modal="true"></div>
  </div>

  <div id="pinBox" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <form id="pinForm" class="sheet-card glass-strong pin">
      <h2>PIN de acesso</h2>
      <p>Digite o PIN configurado no Cloudflare.</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button class="btn primary wide" type="submit">Entrar</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
