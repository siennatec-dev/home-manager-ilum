<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Iluminação</title>
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Iluminação">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow"><span id="conn" class="dot"></span><span id="connText">Conectando…</span></p>
        <h1>Iluminação</h1>
        <p id="summary" class="summary">—</p>
      </div>
      <button id="refresh" class="icon-btn glass" aria-label="Atualizar estados">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" /></svg>
      </button>
    </header>

    <section class="scenes">
      <button class="scene glass" data-scene="on">
        <span class="scene-ico on"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.1 1 1.85V16h5v-.25c0-.75.4-1.4 1-1.85A6 6 0 0 0 12 3Z"/></svg></span>
        <span>Ligar tudo</span>
      </button>
      <button class="scene glass" data-scene="off">
        <span class="scene-ico"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></span>
        <span>Desligar tudo</span>
      </button>
    </section>

    <nav id="chips" class="chips"></nav>
    <div id="rooms"></div>
    <p class="foot">Home Manager · Comercial</p>
  </main>

  <!-- Painel de controle (estilo HomeKit) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card glass-strong" role="dialog" aria-modal="true" aria-labelledby="sheetName">
      <div class="sheet-head">
        <div class="tile-ico big" id="sheetIco"></div>
        <div>
          <h2 id="sheetName">—</h2>
          <p id="sheetState">—</p>
        </div>
        <button class="close" data-close aria-label="Fechar">✕</button>
      </div>
      <div class="slider" id="slider" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-label" id="sliderLabel">0%</div>
      </div>
      <div class="swatches" id="swatches" hidden></div>
      <div class="sheet-actions">
        <button class="pill glass" data-level="0">Desligar</button>
        <button class="pill glass" data-level="50">50%</button>
        <button class="pill glass" data-level="100">100%</button>
      </div>
    </div>
  </div>

  <!-- PIN -->
  <div id="pinBox" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <form id="pinForm" class="sheet-card glass-strong pin">
      <h2>PIN de acesso</h2>
      <p>Digite o PIN configurado no Cloudflare.</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button class="pill primary" type="submit">Entrar</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
